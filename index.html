<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content: on Chromium and Firefox for Android the on-screen keyboard
      shrinks the layout viewport (and dvh), so builder fields and sticky actions stay above it.
      iOS Safari ignores it and keeps its own behaviour. See docs/architecture.md, section 13.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Museums are private gifts reached only by link (FR-49). Nothing on this site is indexed. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <!-- Never send this page's URL to other sites. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f4efe8" />
    <meta name="description" content="Someone has made you a little museum." />
    <!-- Link previews in messaging apps see only these generic tags, never museum content. -->
    <meta property="og:title" content="Surprise Museum" />
    <meta property="og:description" content="Someone has made you a little museum. Open to see." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Surprise Museum</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >Surprise Museum needs JavaScript turned on. Please enable it and reload the page.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
