<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb89e"/>
      <stop offset="1" stop-color="#e6d7c3"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6643"/>
      <stop offset="1" stop-color="#b88a5f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Room -->
  <rect x="24" y="24" width="432" height="232" rx="6" fill="url(#wall)"/>
  <rect x="24" y="24" width="432" height="26" rx="6" fill="#3b2c33"/>
  <rect x="24" y="44" width="432" height="6" fill="#3b2c33"/>
  <path d="M24 256h432v66a6 6 0 0 1-6 6H30a6 6 0 0 1-6-6z" fill="url(#floor)"/>
  <rect x="24" y="244" width="432" height="12" fill="#f3eadc"/>
  <g stroke="#7a5238" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M110 256 70 328M170 256 140 328M240 256v72M310 256l30 72M370 256l70 72"/>
  </g>

  <!-- A light shining on an empty wall -->
  <ellipse cx="240" cy="140" rx="130" ry="110" fill="url(#glow)"/>
  <rect x="204" y="62" width="72" height="8" rx="4" fill="#c9a15b"/>
  <rect x="237" y="70" width="6" height="14" fill="#9c7637"/>
  <rect x="214" y="72" width="52" height="3" rx="1.5" fill="#fff0d2"/>

  <!-- The picture that is not there: a pale ghost where it hung, and an empty frame, a little crooked -->
  <rect x="176" y="96" width="128" height="104" rx="3" fill="#cdb89e" fill-opacity="0.45"/>
  <g transform="rotate(-3 240 148)">
    <rect x="182" y="92" width="116" height="104" rx="3" fill="#4a3226"/>
    <rect x="190" y="100" width="100" height="88" fill="#f3ebdd"/>
    <rect x="198" y="108" width="84" height="72" fill="#efe5d6"/>
    <path d="M230 134q0-12 11-12t11 11q0 7-8 11-3 2-3 7v2" fill="none" stroke="#9c7637" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="241" cy="170" r="3.4" fill="#9c7637"/>
  </g>

  <!-- Floor pool and runner stub -->
  <ellipse cx="240" cy="284" rx="78" ry="16" fill="url(#pool)"/>
  <path d="M214 256h52l30 72H184z" fill="#7a2e43"/>
  <path d="M214 256l-30 72h5l27-66zM266 256l30 72h-5l-27-66z" fill="#c9a15b"/>

  <!-- The Guide, palms up -->
  <g>
    <ellipse cx="350" cy="320" rx="24" ry="5" fill="#1e1419" fill-opacity="0.3"/>
    <rect x="338" y="294" width="9" height="24" rx="4.5" fill="#2f2d36"/>
    <rect x="352" y="294" width="9" height="24" rx="4.5" fill="#2f2d36"/>
    <rect x="332" y="262" width="34" height="38" rx="11" fill="#263a66"/>
    <path d="M334 270l-14 12" stroke="#263a66" stroke-width="9" stroke-linecap="round"/>
    <path d="M364 270l14 12" stroke="#263a66" stroke-width="9" stroke-linecap="round"/>
    <circle cx="318" cy="285" r="5" fill="#dda073"/>
    <circle cx="380" cy="285" r="5" fill="#dda073"/>
    <circle cx="356" cy="276" r="4.4" fill="#c9a15b"/>
    <circle cx="349" cy="248" r="15" fill="#dda073"/>
    <path d="M334 246q2-17 15-17t15 17q-6-8-15-8t-15 8z" fill="#3b2820"/>
    <circle cx="344" cy="250" r="1.7" fill="#2a1f26"/>
    <circle cx="354" cy="250" r="1.7" fill="#2a1f26"/>
    <path d="M344 258h10" fill="none" stroke="#7d3b45" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M341 244l6-2M351 242l6 2" stroke="#3b2820" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
